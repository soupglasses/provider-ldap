apiVersion: v1
kind: Namespace
metadata:
  name: applications
---
apiVersion: v1
kind: Secret
metadata:
  name: directory-credentials
  namespace: applications
stringData:
  credentials.yaml: |
    host: ldap.example.org
    bindDN: cn=service-admin,dc=example,dc=org
    password: replace-me
---
apiVersion: ldap.finnes.dev/v1beta1
kind: ProviderConfig
metadata:
  name: directory
  namespace: applications
spec:
  credentials:
    source: Secret
    secretRef:
      name: directory-credentials
      key: credentials.yaml
      namespace: applications
