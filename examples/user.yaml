apiVersion: ldap.finnes.dev/v1alpha1
kind: Entry
metadata:
  name: service
  namespace: applications
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: directory
  forProvider:
    dn: uid=application,ou=services,dc=example,dc=org
    attributes:
      cn:
        - Application
      sn:
        - Service
    attributeSecretRefs:
      userPassword:
        name: application-password
        key: password
    sharedAttributes:
      objectClass:
        - inetOrgPerson
