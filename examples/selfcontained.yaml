apiVersion: v1
kind: Namespace
metadata:
  name: applications
---
apiVersion: v1
kind: Secret
metadata:
  name: directory-credentials
  namespace: applications
stringData:
  credentials.yaml: |
    host: ldap.example.org
    port: 636
    bindDN: cn=service-admin,dc=example,dc=org
    password: replace-me
    tls: true
---
apiVersion: ldap.finnes.dev/v1beta1
kind: ProviderConfig
metadata:
  name: directory
  namespace: applications
spec:
  credentials:
    source: Secret
    secretRef:
      name: directory-credentials
      key: credentials.yaml
      namespace: applications
---
apiVersion: v1
kind: Secret
metadata:
  name: application-password
  namespace: applications
stringData:
  password: replace-me-with-a-random-password
---
apiVersion: ldap.finnes.dev/v1alpha1
kind: Entry
metadata:
  name: service
  namespace: applications
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: directory
  forProvider:
    dn: uid=application,ou=services,dc=example,dc=org
    attributes:
      cn:
        - Application
      sn:
        - Service
    attributeSecretRefs:
      userPassword:
        name: application-password
        key: password
    sharedAttributes:
      objectClass:
        - inetOrgPerson
