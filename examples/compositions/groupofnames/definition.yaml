apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: groupofnames.examples.ldap.finnes.dev
spec:
  scope: Namespaced
  group: examples.ldap.finnes.dev
  names:
    kind: GroupOfNames
    plural: groupofnames
  defaultCompositionRef:
    name: example-groupofnames
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - cn
                - baseDN
                - backendRef
                - sentinelDN
              properties:
                cn:
                  type: string
                  pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                baseDN:
                  type: string
                  minLength: 1
                description:
                  type: string
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                backendRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ProviderConfig
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: backendRef is immutable
                sentinelDN:
                  type: string
                  minLength: 1
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: example-groupofnames
spec:
  compositeTypeRef:
    apiVersion: examples.ldap.finnes.dev/v1alpha1
    kind: GroupOfNames
  mode: Pipeline
  pipeline:
    - step: ldap
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $spec := $xr.spec -}}
            {{- $entry := getComposedResource . "entry" -}}
            {{- $attributes := dict "cn" (list $spec.cn) -}}
            {{- if hasKey $spec "description" -}}
              {{- $_ := set $attributes "description" (ternary (list $spec.description) (list) (ne $spec.description "")) -}}
            {{- end -}}
            {{- $parameters := dict "dn" (printf "cn=%s,%s" $spec.cn $spec.baseDN) "attributes" $attributes "sharedAttributes" (dict "objectClass" (list "groupOfNames") "member" (list $spec.sentinelDN)) -}}
            {{- $generationMatches := and $entry (eq (toString (dig "status" "atProvider" "observedGeneration" 0 $entry)) (toString $entry.metadata.generation)) -}}
            {{- $ready := not (empty (and $entry $generationMatches (deepEqual $entry.spec.forProvider $parameters) (eq (getResourceCondition "Ready" $entry).Status "True") (eq (getResourceCondition "Synced" $entry).Status "True"))) -}}
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/ready: {{ $ready | ternary "True" "False" | quote }}
            status: {}
            ---
            apiVersion: ldap.finnes.dev/v1alpha1
            kind: Entry
            metadata:
              namespace: {{ $xr.metadata.namespace }}
              annotations:
                {{ setResourceNameAnnotation "entry" }}
                gotemplating.fn.crossplane.io/ready: {{ $ready | ternary "True" "False" | quote }}
            spec:
              managementPolicies: {{ if eq ($spec.deletionPolicy | default "Delete") "Delete" }}[Observe, Create, Update, Delete]{{ else }}[Observe, Create, Update]{{ end }}
              providerConfigRef: {{ $spec.backendRef | toJson }}
              forProvider: {{ $parameters | toJson }}
