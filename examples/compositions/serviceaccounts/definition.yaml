apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: serviceaccounts.examples.ldap.finnes.dev
spec:
  scope: Namespaced
  group: examples.ldap.finnes.dev
  names:
    kind: ServiceAccount
    plural: serviceaccounts
  defaultCompositionRef:
    name: example-serviceaccounts
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - cn
                - baseDN
                - backendRef
              properties:
                cn:
                  type: string
                  pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: cn is immutable
                baseDN:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: baseDN is immutable
                description:
                  type: string
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                backendRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ProviderConfig
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: backendRef is immutable
                rotationID:
                  type: string
                  default: ""
            status:
              type: object
              properties:
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: example-serviceaccounts
spec:
  compositeTypeRef:
    apiVersion: examples.ldap.finnes.dev/v1alpha1
    kind: ServiceAccount
  mode: Pipeline
  pipeline:
    - step: ldap
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $spec := $xr.spec -}}
            {{- $entry := getComposedResource . "entry" -}}
            {{- $secret := getComposedResource . "password" -}}
            {{- $rotation := $spec.rotationID | default "" -}}
            {{- $password := "" -}}
            {{- $rotationMatches := and $secret (eq (dig "metadata" "annotations" "examples.ldap.finnes.dev/rotation-id" "" $secret) $rotation) -}}
            {{- if and $rotationMatches (dig "data" "password" "" $secret) -}}
              {{- $password = $secret.data.password -}}
            {{- else -}}
              {{- $password = randAlphaNum 32 | b64enc -}}
            {{- end -}}
            {{- $ldapPassword := "" -}}
            {{- if and $rotationMatches (dig "data" "password" "" $secret) (dig "data" "ldap-password" "" $secret) -}}
              {{- $ldapPassword = index $secret.data "ldap-password" -}}
            {{- else -}}
              {{- $ldapPassword = printf "{CRYPT}%s" (bcrypt ($password | b64dec)) | b64enc -}}
            {{- end -}}
            {{- $attributes := dict "cn" (list $spec.cn) "sn" (list "Service") -}}
            {{- if hasKey $spec "description" -}}
              {{- $_ := set $attributes "description" (ternary (list $spec.description) (list) (ne $spec.description "")) -}}
            {{- end -}}
            {{- $secretName := dig "metadata" "name" "" ($secret | default dict) -}}
            {{- $parameters := dict "dn" (printf "uid=%s,%s" $spec.cn $spec.baseDN) "attributes" $attributes "additiveAttributes" (dict "objectClass" (list "inetOrgPerson")) "attributeSecretRefs" (dict "userPassword" (dict "name" $secretName "key" "ldap-password")) -}}
            {{- $entryReady := and $entry (eq (getResourceCondition "Ready" $entry).Status "True") (eq (getResourceCondition "Synced" $entry).Status "True") -}}
            {{- $generationMatches := and $entry (eq (toString (dig "status" "atProvider" "observedGeneration" 0 $entry)) (toString $entry.metadata.generation)) -}}
            {{- $versionMatches := and $entry $secret (eq (dig "status" "atProvider" "observedSecretVersions" "userpassword" "" $entry) $secret.metadata.resourceVersion) -}}
            {{- $ready := not (empty (and $rotationMatches (dig "data" "ldap-password" "" ($secret | default dict)) $entryReady $generationMatches $versionMatches (deepEqual $entry.spec.forProvider $parameters))) -}}
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/ready: {{ $ready | ternary "True" "False" | quote }}
            status:
              {{- if $secret }}
              secretRef:
                name: {{ $secret.metadata.name }}
              {{- end }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              namespace: {{ $xr.metadata.namespace }}
              annotations:
                {{ setResourceNameAnnotation "password" }}
                gotemplating.fn.crossplane.io/ready: "True"
                examples.ldap.finnes.dev/rotation-id: {{ $rotation | quote }}
            type: Opaque
            data:
              password: {{ $password | quote }}
              ldap-password: {{ $ldapPassword | quote }}
            {{- if or $entry (and $secret (dig "data" "password" "" $secret)) }}
            ---
            apiVersion: ldap.finnes.dev/v1alpha1
            kind: Entry
            metadata:
              namespace: {{ $xr.metadata.namespace }}
              annotations:
                {{ setResourceNameAnnotation "entry" }}
                gotemplating.fn.crossplane.io/ready: {{ $ready | ternary "True" "False" | quote }}
            spec:
              {{- if not $secret }}
              {{- $entry.spec | toYaml | nindent 2 }}
              {{- else }}
              managementPolicies: {{ if eq ($spec.deletionPolicy | default "Delete") "Delete" }}[Observe, Create, Update, Delete]{{ else }}[Observe, Create, Update]{{ end }}
              providerConfigRef: {{ $spec.backendRef | toJson }}
              forProvider: {{ $parameters | toJson }}
              {{- end }}
            {{- end }}
