apiVersion: v1
kind: ServiceAccount
metadata:
  name: ldap-tests
  namespace: ldap-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ldap-tests
  namespace: ldap-test
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [ldap.ops.finnes.dev]
    resources: [entries, providerconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ldap-tests
  namespace: ldap-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ldap-tests
subjects:
  - kind: ServiceAccount
    name: ldap-tests
    namespace: ldap-test
---
apiVersion: v1
kind: Pod
metadata:
  name: ldap-tests
  namespace: ldap-test
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: ldap-tests
  containers:
    - name: tests
      image: provider-ldap-tests:development
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: temporary
          mountPath: /tmp
      args:
        - -test.v
        - -test.timeout=8m
        - "-test.run=Test"
      env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TEST_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP


        - name: PROVIDER_NAMESPACE
          value: crossplane-system


      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
  volumes:
    - name: temporary
      emptyDir: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ldap-tests
  namespace: crossplane-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ldap-tests
  namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ldap-tests
subjects:
  - kind: ServiceAccount
    name: ldap-tests
    namespace: ldap-test
