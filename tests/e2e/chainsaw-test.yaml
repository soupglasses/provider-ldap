apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ldap-lifecycle
spec:
  namespace: ldap-test
  timeouts:
    assert: 60s
    error: 60s
    exec: 180s
    cleanup: 60s
  steps:
    - name: directory-fixture
      try:
        - apply:
            file: fixture.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ldap
              status:
                availableReplicas: 1
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - ldapadd
              - -x
              - -H
              - ldap://127.0.0.1:1389
              - -D
              - cn=admin,dc=example,dc=test
              - -w
              - disposable-fixture-password
              - -f
              - /fixtures/base.ldif
    - name: create
      try:
        - apply:
            file: entry.yaml
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: service
              status:
                (conditions[?type == 'Ready'].status | [0]): "True"
                (conditions[?type == 'Synced'].status | [0]): "True"
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=uid=service,ou=users,dc=example,dc=test
              - LDAP_EXPECT_JSON={"cn":["Service"],"userPassword":["fixture-password-1"]}
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
    - name: missing-credentials-fail-closed
      try:
        - apply:
            resource:
              apiVersion: ldap.finnes.dev/v1beta1
              kind: ProviderConfig
              metadata:
                name: unavailable
              spec:
                credentials:
                  source: Secret
                  secretRef:
                    name: does-not-exist
                    key: credentials.yaml
                    namespace: ldap-test
        - apply:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: unavailable
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                providerConfigRef:
                  kind: ProviderConfig
                  name: unavailable
                forProvider:
                  dn: uid=must-not-exist,ou=users,dc=example,dc=test
                  attributes:
                    objectClass:
                      - inetOrgPerson
                    cn:
                      - Missing
                    sn:
                      - Account
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: unavailable
              status:
                (conditions[?type == 'Synced'].status | [0]): "False"
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=uid=must-not-exist,ou=users,dc=example,dc=test
              - LDAP_EXPECT_ABSENT=true
              - LDAP_STABLE_FOR=3s
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
    - name: shared-values-preserve-external-values
      try:
        - apply:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: group
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - Delete
                providerConfigRef:
                  kind: ProviderConfig
                  name: directory
                forProvider:
                  dn: cn=shared,ou=groups,dc=example,dc=test
                  attributes:
                    cn:
                      - shared
                    description:
                      - Managed group
                  sharedAttributes:
                    objectClass:
                      - groupOfNames
                    member:
                      - uid=sentinel,ou=users,dc=example,dc=test
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: group
              status:
                (conditions[?type == 'Ready'].status | [0]): "True"
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: group
              spec:
                forProvider:
                  attributes:
                    employeeNumber:
                      - "123"
                  sharedAttributes:
                    objectClass:
                      - groupOfNames
                      - extensibleObject
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=shared,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"employeeNumber": ["123"], "objectClass": ["groupOfNames", "extensibleObject"], "member": ["uid=sentinel,ou=users,dc=example,dc=test"]}'
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - sh
              - -ec
              - 'printf ''%s\n'' ''dn: cn=shared,ou=groups,dc=example,dc=test'' ''changetype: modify'' ''replace: member'' ''member: uid=external-service,ou=users,dc=example,dc=test'' ''-'' ''replace: description'' ''description: drifted'' ''-'' | ldapmodify -x -H ldap://127.0.0.1:1389 -D cn=admin,dc=example,dc=test -w disposable-fixture-password'
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=shared,ou=groups,dc=example,dc=test
              - LDAP_EXPECT_JSON={"description":["Managed group"],"objectClass":["groupOfNames","extensibleObject"],"member":["uid=sentinel,ou=users,dc=example,dc=test","uid=external-service,ou=users,dc=example,dc=test"]}
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
        - delete:
            ref:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              name: group
        - error:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: group
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=shared,ou=groups,dc=example,dc=test
              - LDAP_EXPECT_ABSENT=true
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
    - name: schema-alias-and-map-overlap
      try:
        - apply:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: alias-rdn
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - Delete
                providerConfigRef:
                  kind: ProviderConfig
                  name: directory
                forProvider:
                  dn: cn=Aliases,ou=groups,dc=example,dc=test
                  attributes:
                    2.5.4.3:
                      - Aliases
                  sharedAttributes:
                    objectClass:
                      - groupOfNames
                    member:
                      - uid=sentinel,ou=users,dc=example,dc=test
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: alias-rdn
              status:
                (conditions[?type == 'Ready'].status | [0]): "True"
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=Aliases,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"cn": ["Aliases"]}'
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
        - apply:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: alias-overlap
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                providerConfigRef:
                  kind: ProviderConfig
                  name: directory
                forProvider:
                  dn: cn=Denied,ou=groups,dc=example,dc=test
                  attributes:
                    cn:
                      - Denied
                  sharedAttributes:
                    2.5.4.3:
                      - Denied
                    objectClass:
                      - groupOfNames
                    member:
                      - uid=sentinel,ou=users,dc=example,dc=test
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: alias-overlap
              status:
                (conditions[?type == 'Synced'].status | [0]): "False"
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=Denied,ou=groups,dc=example,dc=test
              - LDAP_EXPECT_ABSENT=true
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
        - delete:
            ref:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              name: alias-overlap
        - delete:
            ref:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              name: alias-rdn
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=Aliases,ou=groups,dc=example,dc=test
              - LDAP_EXPECT_ABSENT=true
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
    - name: repair-only-owned-attributes
      try:
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - ldapmodify
              - -x
              - -H
              - ldap://127.0.0.1:1389
              - -D
              - cn=admin,dc=example,dc=test
              - -w
              - disposable-fixture-password
              - -f
              - /fixtures/drift.ldif
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=uid=service,ou=users,dc=example,dc=test
              - LDAP_EXPECT_JSON={"cn":["Service"],"description":["external owner"],"telephoneNumber":["555-0100"]}
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
    - name: rotate-password
      try:
        - patch:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: service-password
              type: Opaque
              stringData:
                password: fixture-password-2
        - command:
            entrypoint: kubectl
            args:
              - exec
              - --namespace
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=uid=service,ou=users,dc=example,dc=test
              - LDAP_EXPECT_JSON={"userPassword":["fixture-password-2"]}
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: service
              (contains(to_string(@), 'fixture-password-2')): false
    - name: shared-values-retirement-and-modifydn
      try:
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - sh
              - -ec
              - 'printf ''%s\n'' ''dn: cn=subset-owned,ou=groups,dc=example,dc=test'' ''objectClass: groupOfNames'' ''cn: subset-owned'' ''member: uid=external-service,ou=users,dc=example,dc=test'' | ldapadd -x -H ldap://127.0.0.1:1389 -D cn=admin,dc=example,dc=test -w disposable-fixture-password'
        - apply:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - Delete
                providerConfigRef:
                  kind: ProviderConfig
                  name: directory
                forProvider:
                  dn: cn=subset-owned,ou=groups,dc=example,dc=test
                  attributes:
                    cn:
                      - subset-owned
                  sharedAttributes:
                    objectClass:
                      - groupOfNames
                    member:
                      - uid=sentinel-a,ou=users,dc=example,dc=test
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              status:
                (conditions[?type == 'Ready'].status | [0]): "True"
        - command:
            entrypoint: kubectl
            args:
              - get
              - entry/subset-owned
              - -n
              - ldap-test
              - -o
              - json
            outputs:
              - name: subsetUUID
                value: (json_parse($stdout).status.atProvider.uuid)
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-a,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  sharedAttributes:
                    member:
                      - uid=sentinel-b,ou=users,dc=example,dc=test
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-b,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  sharedAttributes:
                    member:
                      - UID=sentinel-b,OU=users,DC=example,DC=test
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              (status.atProvider.observedGeneration == metadata.generation): true
              status:
                (conditions[?type == 'Synced'].status | [0]): "True"
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-b,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  sharedAttributes:
                    member: []
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  sharedAttributes:
                    member:
                      - uid=sentinel-a,ou=users,dc=example,dc=test
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-a,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  sharedAttributes:
                    member: null
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  sharedAttributes:
                    member:
                      - uid=sentinel-c,ou=users,dc=example,dc=test
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-c,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  dn: cn=subset-renamed,ou=groups,dc=example,dc=test
                  attributes:
                    cn:
                      - subset-renamed
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-owned,ou=groups,dc=example,dc=test
              - LDAP_EXPECT_ABSENT=true
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-renamed,ou=groups,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-c,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"], "cn": ["subset-renamed"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  dn: cn=subset-renamed,ou=groups-moved,dc=example,dc=test
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-renamed,ou=groups,dc=example,dc=test
              - LDAP_EXPECT_ABSENT=true
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-renamed,ou=groups-moved,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-c,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - sh
              - -ec
              - 'printf ''%s\n'' ''dn: cn=foreign-target,ou=groups-moved,dc=example,dc=test'' ''objectClass: groupOfNames'' ''cn: foreign-target'' ''member: uid=foreign-service,ou=users,dc=example,dc=test'' | ldapadd -x -H ldap://127.0.0.1:1389 -D cn=admin,dc=example,dc=test -w disposable-fixture-password'
        - patch:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              spec:
                forProvider:
                  dn: cn=foreign-target,ou=groups-moved,dc=example,dc=test
                  attributes:
                    cn:
                      - foreign-target
        - assert:
            resource:
              apiVersion: ldap.finnes.dev/v1alpha1
              kind: Entry
              metadata:
                name: subset-owned
              status:
                (conditions[?type == 'Synced'].status | [0]): "False"
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=cn=subset-renamed,ou=groups-moved,dc=example,dc=test
              - 'LDAP_EXPECT_JSON={"member": ["uid=sentinel-c,ou=users,dc=example,dc=test", "uid=external-service,ou=users,dc=example,dc=test"]}'
              - LDAP_EXPECT_UUID=$EXPECTED_UUID
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
            env:
              - name: EXPECTED_UUID
                value: ($subsetUUID)
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
