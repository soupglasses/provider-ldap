              secret=$(kubectl get serviceaccount.examples.ldap.finnes.dev generated -n ldap-test -o jsonpath='{.status.secretRef.name}')
              kubectl get secret "$secret" -n ldap-test -o jsonpath='{.metadata.uid}'
            outputs:
              - name: previousSecretUID
                value: ($stdout)
        - script:
            content: |
              set -eu
              secret=$(kubectl get serviceaccount.examples.ldap.finnes.dev generated -n ldap-test -o jsonpath='{.status.secretRef.name}')
              kubectl get secret "$secret" -n ldap-test -o jsonpath='{.data.password}' | sha256sum > /tmp/provider-ldap-lost-password.sha256
              kubectl delete secret "$secret" -n ldap-test --wait=true
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                labels:
                  crossplane.io/composite: generated
              (metadata.uid != $previousSecretUID): true
        - assert:
            resource:
              apiVersion: examples.ldap.finnes.dev/v1alpha1
              kind: ServiceAccount
              metadata:
                name: generated
              status:
                (conditions[?type == 'Ready'].status | [0]): "True"
        - script:
            content: |
              set -eu
              secret=$(kubectl get serviceaccount.examples.ldap.finnes.dev generated -n ldap-test -o jsonpath='{.status.secretRef.name}')
              encoded=$(kubectl get secret "$secret" -n ldap-test -o jsonpath='{.data.password}')
              password=$(printf %s "$encoded" | base64 -d)
              [ "${#password}" -eq 32 ]
              cn=$(kubectl get serviceaccount.examples.ldap.finnes.dev generated -n ldap-test -o jsonpath='{.spec.cn}')
              base=$(kubectl get serviceaccount.examples.ldap.finnes.dev generated -n ldap-test -o jsonpath='{.spec.baseDN}')
              kubectl exec -n ldap-test deployment/ldap -- env LDAP_BIND_PASSWORD="$password" LDAP_BIND_DN="uid=$cn,$base" /tests/check -test.run=^TestLDAPBind$ -test.v
        - script:
            content: |
              set -eu
              trap 'rm -f /tmp/provider-ldap-lost-password.sha256' EXIT
              secret=$(kubectl get serviceaccount.examples.ldap.finnes.dev generated -n ldap-test -o jsonpath='{.status.secretRef.name}')
              if kubectl get secret "$secret" -n ldap-test -o jsonpath='{.data.password}' | sha256sum | cmp -s /tmp/provider-ldap-lost-password.sha256 -; then
                echo 'lost credentials were not regenerated' >&2
                exit 1
              fi
        - delete:
            ref:
              apiVersion: examples.ldap.finnes.dev/v1alpha1
              kind: ServiceAccount
              name: generated
        - command:
            entrypoint: kubectl
            args:
              - exec
              - -n
              - ldap-test
              - deployment/ldap
              - --
              - env
              - LDAP_EXPECT_DN=uid=generated-renamed,ou=groups-moved,dc=example,dc=test
              - LDAP_EXPECT_ABSENT=true
              - /tests/check
              - -test.run=^TestLDAPState$
              - -test.v
