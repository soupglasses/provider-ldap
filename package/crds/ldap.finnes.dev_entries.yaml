apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: entries.ldap.finnes.dev
spec:
  group: ldap.finnes.dev
  names:
    categories:
      - crossplane
      - managed
      - ldap
    kind: Entry
    listKind: EntryList
    plural: entries
    singular: entry
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=='Ready')].status
          name: READY
          type: string
        - jsonPath: .status.conditions[?(@.type=='Synced')].status
          name: SYNCED
          type: string
        - jsonPath: .spec.forProvider.dn
          name: DN
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                forProvider:
                  description: EntryParameters declares attribute ownership. LDAP attribute names are case insensitive.
                  properties:
                    absentAttributes:
                      additionalProperties:
                        items:
                          type: string
                        type: array
                      description: |-
                        AbsentAttributes removes only these values, preserving all other values.
                        Values must be distinct from additive values under the directory's equality rules.
                      maxProperties: 128
                      type: object
                    additiveAttributes:
                      additionalProperties:
                        items:
                          type: string
                        type: array
                      description: AdditiveAttributes ensures values are present with atomic LDAP Add operations, preserving all other values.
                      maxProperties: 128
                      type: object
                    attributeSecretRefs:
                      additionalProperties:
                        description: |-
                          A LocalSecretKeySelector is a reference to a secret key
                          in the same namespace with the referencing object.
                        properties:
                          key:
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                        required:
                          - key
                          - name
                        type: object
                      description: |-
                        AttributeSecretRefs owns a single value from a local Secret for each declared attribute.
                        Secret values are never copied to status or connection details.
                      maxProperties: 128
                      type: object
                    attributes:
                      additionalProperties:
                        items:
                          type: string
                        type: array
                      description: Attributes owns exactly the values of declared keys. Empty lists clear an attribute; omitted keys are preserved.
                      maxProperties: 128
                      type: object
                    dn:
                      description: DN identifies the entry, including when adopting existing directory data.
                      maxLength: 8192
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                        - message: dn is immutable
                          rule: self == oldSelf
                  required:
                    - dn
                  type: object
                managementPolicies:
                  default:
                    - '*'
                  description: |-
                    THIS IS A BETA FIELD. It is on by default but can be opted out
                    through a Crossplane feature flag.
                    ManagementPolicies specify the array of actions Crossplane is allowed to
                    take on the managed and external resources.
                    See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                    and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                  items:
                    description: |-
                      A ManagementAction represents an action that the Crossplane controllers
                      can take on an external resource.
                    enum:
                      - Observe
                      - Create
                      - Update
                      - Delete
                      - LateInitialize
                      - '*'
                    type: string
                  type: array
                providerConfigRef:
                  default:
                    kind: ClusterProviderConfig
                    name: default
                  description: |-
                    ProviderConfigReference specifies how the provider that will be used to
                    create, observe, update, and delete this managed resource should be
                    configured.
                  properties:
                    kind:
                      description: Kind of the referenced object.
                      type: string
                    name:
                      description: Name of the referenced object.
                      type: string
                  required:
                    - kind
                    - name
                  type: object
                writeConnectionSecretToRef:
                  description: |-
                    WriteConnectionSecretToReference specifies the namespace and name of a
                    Secret to which any connection details for this managed resource should
                    be written. Connection details frequently include the endpoint, username,
                    and password required to connect to the managed resource.
                  properties:
                    name:
                      description: Name of the secret.
                      type: string
                  required:
                    - name
                  type: object
              required:
                - forProvider
              type: object
            status:
              properties:
                atProvider:
                  properties:
                    dn:
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is acknowledged only after observing full external convergence.
                      format: int64
                      type: integer
                    observedSecretVersions:
                      additionalProperties:
                        type: string
                      description: ObservedSecretVersions acknowledges verified Secret input versions; it contains no values.
                      type: object
                    uuid:
                      type: string
                  type: object
                conditions:
                  description: Conditions of the resource.
                  items:
                    description: A Condition that may apply to a resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          LastTransitionTime is the last time this condition transitioned from one
                          status to another.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A Message containing details about this condition's last transition from
                          one status to another, if any.
                        type: string
                      observedGeneration:
                        description: |-
                          ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        type: integer
                      reason:
                        description: A Reason for this condition's last transition from one status to another.
                        type: string
                      status:
                        description: Status of this condition; is it currently True, False, or Unknown?
                        type: string
                      type:
                        description: |-
                          Type of this condition. At most one of each condition type may apply to
                          a resource at any point in time.
                        type: string
                    required:
                      - lastTransitionTime
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastHandledReconcileAt:
                  description: |-
                    LastHandledReconcileAt holds the value of the most recent
                    reconcile-requested-at annotation token that the controller has
                    processed. Users can compare this to the annotation to determine
                    whether a reconcile request has been handled.
                  type: string
                observedGeneration:
                  description: |-
                    ObservedGeneration is the latest metadata.generation
                    which resulted in either a ready state, or stalled due to error
                    it can not recover from without human intervention.
                  format: int64
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
